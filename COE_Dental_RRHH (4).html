<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COE Dental - Gestión de Personal</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#fafafa;color:#1a1a1a}
.nav{background:#fff;border-bottom:2px solid #f5c4b0;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.logo{width:36px;height:36px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#f0a888;font-weight:900;font-size:11px;flex-shrink:0}
.nav-brand{font-weight:800;font-size:14px;margin-left:8px}
.nav-tabs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:#f5f5f5;color:#666}
.tab.active{background:#f5c4b0;color:#b85c3a}
.tab.active-green{background:#c0e8da;color:#1a4d3e}
.tab.active-blue{background:#b8dcf5;color:#0e3f5e}
.stats{background:#fff;border-bottom:1px solid #eee;padding:6px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:7px}
.sn{font-weight:800;font-size:16px}.sl{font-size:10px}
.container{max-width:1100px;margin:0 auto;padding:16px 14px}
.search-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.search-row input,.search-row select{padding:8px 12px;border-radius:8px;border:1.5px solid #ddd;font-size:13px;outline:none;background:#fff}
.search-row input{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;padding:14px;cursor:pointer;border:1.5px solid #f0a888;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.card.lab{border-color:#a8d9cc}
.card.inactive{opacity:.72}
.cn{font-weight:700;font-size:13px;line-height:1.3}
.cr{font-size:11px;color:#aaa;margin-top:2px}
.chips{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;border:1px solid}
.baja-tag{margin-top:6px;font-size:10px;color:#b85c3a;font-weight:700;background:#fde8df;display:inline-block;padding:2px 6px;border-radius:4px}
.dh{border-radius:12px 12px 0 0;padding:18px 22px;display:flex;align-items:center;gap:14px;border:1.5px solid #f0a888;border-bottom:none}
.dh.lab{border-color:#a8d9cc}
.db{background:#fff;border:1.5px solid #f0a888;border-top:none;border-radius:0 0 12px 12px;padding:16px 22px}
.db.lab{border-color:#a8d9cc}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.sec{border-radius:9px;overflow:hidden;border:1.5px solid #ddd}
.sth{padding:7px 12px;font-weight:700;font-size:12px}
.sb{padding:11px 13px;background:#fff}
.ir{display:flex;gap:8px;margin-bottom:6px;font-size:12px}
.il{color:#aaa;min-width:120px;flex-shrink:0}
.iv{font-weight:500;word-break:break-word}
.fw{background:#fff;border-radius:12px;padding:22px;border:1.5px solid #f5c4b0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fl label{font-size:10px;color:#aaa;display:block;margin-bottom:2px;font-weight:600;text-transform:uppercase}
.fl input,.fl select,.fl textarea{width:100%;padding:7px 10px;border-radius:7px;border:1.5px solid #ddd;font-size:12px;color:#1a1a1a}
.fl textarea{resize:vertical}
.doc-item{display:flex;align-items:center;gap:8px;background:#e0f1fb;border-radius:7px;padding:8px 12px;border:1px solid #b8dcf5;margin-bottom:5px}
.doc-i{flex:1}.doc-n{font-weight:600;font-size:12px}.doc-m{font-size:10px;color:#aaa}
.sr{min-height:240px;background:#fafafa;border-radius:10px;padding:12px}
.ri{margin-bottom:8px;padding:10px 12px;background:#fff;border-radius:8px;border:1px solid #ddd;font-size:12px;white-space:pre-wrap;line-height:1.6}
.smsg{font-size:11px;color:#2a7a62;font-weight:600;padding:3px 8px;background:#e2f5ef;border-radius:5px}
.btn{padding:6px 13px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-p{background:#f0a888;color:#7a3520}
.btn-s{background:#a8d9cc;color:#1a4d3e}
.btn-g{background:#fff;border:1.5px solid #ddd;color:#666}
.btn-d{background:#fde8df;color:#b85c3a}
.btn-lg{padding:9px 22px;font-size:13px;font-weight:800}
.br{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.av{border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.chat-wrap{height:320px;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:8px}
.cb{max-width:76%;padding:8px 12px;font-size:12px;line-height:1.6;white-space:pre-wrap;border-radius:12px}
.cb.u{align-self:flex-end;background:#f5c4b0;color:#7a3520;border-radius:12px 12px 4px 12px}
.cb.a{align-self:flex-start;background:#f5f5f5;color:#1a1a1a;border-radius:12px 12px 12px 4px}
.fbox{border-radius:12px;overflow:hidden;border:2px dashed #f0a888;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fde8df;color:#b85c3a;font-size:12px;font-weight:600}
@media(max-width:600px){.secs{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
</style>
</head>

var LS_KEY = 'coe_v11';
var LS_DOCS = 'coe_docs_v7';

function decodeB64UTF8(b64){
  var bytes=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0);});
  return new TextDecoder('utf-8').decode(bytes);
}
function getEmps(){
  try{var s=localStorage.getItem(LS_KEY);if(s){var p=JSON.parse(s);if(p&&p.length>0)return p;}}catch(e){}
  var d=JSON.parse(decodeB64UTF8(EMP_DATA));
  try{localStorage.setItem(LS_KEY,JSON.stringify(d.map(function(e){return Object.assign({},e,{foto:''});})));}catch(e){}
  return d;
}
function loadBuiltinPhotos(){
  try{
    var pm=JSON.parse(decodeB64UTF8(PHOTO_DATA));
    var ids=Object.keys(pm);
    for(var i=0;i<ids.length;i++){
      var id=ids[i];
      // Only set if not already set by user
      try{
        if(!localStorage.getItem('coe_f9_'+id)){
          localStorage.setItem('coe_f9_'+id,pm[id]);
        }
      }catch(e){}
    }
  }catch(e){}
}
function saveEmps(l){try{localStorage.setItem(LS_KEY,JSON.stringify(l.map(function(e){return Object.assign({},e,{foto:''});})));}catch(e){}}
function getDocs(){try{var s=localStorage.getItem(LS_DOCS);if(s)return JSON.parse(s);}catch(e){}return {};}
loadBuiltinPhotos();
function saveDocs(d){try{localStorage.setItem(LS_DOCS,JSON.stringify(d));}catch(e){}}
function getFoto(id){try{return localStorage.getItem('coe_f9_'+id)||'';}catch(e){return '';}}
function setFoto(id,v){try{localStorage.setItem('coe_f9_'+id,v);}catch(e){}}
function getAK(){try{return localStorage.getItem('coe_ak')||'';}catch(e){return '';}}
function setAK(v){try{localStorage.setItem('coe_ak',v);}catch(e){}}
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

function edDate(s){if(!s||s==='-'||isNaN(Number(s)))return s||'-';var d=new Date(Math.round((Number(s)-25569)*86400000));return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fP(p){if(!p||p==='N/A'||p==='-')return '-';var n=String(p).replace(/[^0-9]/g,'');return n.length>=9?n.slice(0,9).replace(/([0-9]{3})([0-9]{3})([0-9]{3})/,'$1 $2 $3'):p;}
function fm(v){return(!v||v==='-')?'-':v;}
function ini(n){return(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';}
function nId(l){var mx=0;l.forEach(e=>{var n=parseInt((e.id||'0').replace(/[^0-9]/g,'')||'0',10);if(n>mx)mx=n;});return 'COE-'+String(mx+1).padStart(3,'0');}
function ec(emp){return emp.empresa&&emp.empresa.includes('Lab')?{bg:'#e2f5ef',bd:'#a8d9cc',av:'#c0e8da',tx:'#2a7a62',dk:'#1a4d3e'}:{bg:'#fde8df',bd:'#f0a888',av:'#f5c4b0',tx:'#b85c3a',dk:'#7a3520'};}
function emF(){return{foto:'',nombre:'',tipoDoc:'DNI',dni:'',contrato:'PLANILLA',inicioContrato:'',vctoContrato:'',casillero:'',empresa:'Coe Dental',cargo:'',sueldo:'',comisiones:'',afp:'',fIngreso:'',fSalida:'',nacionalidad:'Peruana',cop:'',habilitacion:'',correo:'',telefono:'',direccion:'',distrito:'',fechaNac:'',edad:'',profesion:'',estadoCivil:'',hijos:'',emergenciaNombre:'',emergenciaParentesco:'',emergenciaTel:'',alergias:'No',enfermedades:'No',sangre:'',usuarioSistedent:'',claveSistedent:'',clavePcUsuario:'',clavePc:'',deptoPc:'',claveCel:'',deptoCel:'',obs:'',activo:true};}

function Avatar({emp,size=46}){
  const c=ec(emp);
  const foto=emp.foto||getFoto(emp.id)||'';
  if(foto)return <img src={foto} alt="" style={{width:size,height:size,objectFit:'cover',borderRadius:Math.round(size*.22),border:'2px solid '+c.bd,flexShrink:0,display:'block'}}/>;
  return <div className="av" style={{width:size,height:size,background:c.av,color:c.tx,fontSize:Math.round(size*.28),flexShrink:0}}>{ini(emp.nombre)}</div>;
}

function IR({label,val}){return <div className="ir"><span className="il">{label}</span><span className="iv">{val||'-'}</span></div>;}
function SC({title,bg,col,children}){return <div className="sec"><div className="sth" style={{background:bg,color:col}}>{title}</div><div className="sb">{children}</div></div>;}
function PR({label,val,k}){
  const [sh,setSh]=useState(false);
  const hid=val&&val!=='Sin Contrasena'&&val!=='Patron';
  return <div className="ir"><span className="il">{label}</span><span className="iv">{hid?(sh?val:'••••••••'):val||'-'}</span>
    {hid&&<button onClick={()=>setSh(!sh)} style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'#aaa'}}>{sh?'Ocultar':'Ver'}</button>}
  </div>;
}

function FL({label,name,type,opts,val,onChange}){
  return <div className="fl">
    {label&&<label>{label}</label>}
    {opts?<select value={val||''} onChange={e=>onChange(e.target.value)}>{opts.map(o=><option key={o} value={o}>{o||'- Seleccionar -'}</option>)}</select>
    :type==='ta'?<textarea rows={3} value={val||''} onChange={e=>onChange(e.target.value)}/>
    :<input type={type||'text'} value={val||''} onChange={e=>onChange(e.target.value)}/>}
  </div>;
}

function App(){
  const [emps,setEmps]=useState(()=>getEmps());
  const [docs,setDocs]=useState(()=>getDocs());
  const [view,setView]=useState('list');
  const [sel,setSel]=useState(null);
  const [q,setQ]=useState('');
  const [fE,setFE]=useState('Todas');
  const [fC,setFC]=useState('Todos');
  const [addF,setAddF]=useState(null);
  const [editF,setEditF]=useState(null);
  const [nd,setNd]=useState({nombre:'',tipo:'Permiso de salida',fecha:''});
  const [smsg,setSmsg]=useState('');
  const [bq,setBq]=useState('');
  const [res,setRes]=useState([]);
  const [chat,setChat]=useState([{r:'a',t:'Hola! Soy tu asistente de RR.HH. de COE Dental. En que te puedo ayudar?'}]);
  const [ci,setCi]=useState('');
  const [cld,setCld]=useState(false);

  const [fotos,setFotos]=useState({});
  const chatEnd=useRef(null);

  useEffect(()=>{if(chatEnd.current)chatEnd.current.scrollIntoView({behavior:'smooth'});},[chat,cld]);

  // Load fotos
  useEffect(()=>{
    const f={};
    emps.forEach(e=>{const foto=getFoto(e.id);if(foto)f[e.id]=foto;});

  },[]);

  function showSav(){setSmsg('Guardado');setTimeout(()=>setSmsg(''),2000);}

  function saveE(l){setEmps(l);saveEmps(l);}
  function saveD(d){setDocs(d);saveDocs(d);}

  function updE(id,patch){
    const nl=emps.map(e=>e.id===id?{...e,...patch}:e);
    if(patch.foto&&patch.foto.startsWith('data:')){setFoto(id,patch.foto);setFotos(f=>({...f,[id]:patch.foto}));}
    saveE(nl);
  }
  function setFoto(id,v){setFoto_ls(id,v);}
  function setFoto_ls(id,v){setFoto_impl(id,v);}
  function setFoto_impl(id,v){try{localStorage.setItem('coe_f9_'+id,v);}catch(e){}}

  function saveNew(){
    if(!addF.nombre.trim()||!addF.dni.trim()){alert('Nombre y DNI son obligatorios');return;}
    const id=nId(emps);
    if(addF.foto&&addF.foto.startsWith('data:')){setFoto_impl(id,addF.foto);setFotos(f=>({...f,[id]:addF.foto}));}
    const nl=[...emps,{...addF,id,foto:''}];
    saveE(nl);showSav();setView('list');setAddF(null);
  }
  function saveEdit(){
    if(editF.foto&&editF.foto.startsWith('data:')){setFoto_impl(editF.id,editF.foto);setFotos(f=>({...f,[editF.id]:editF.foto}));}
    const nl=emps.map(e=>e.id===editF.id?{...editF,foto:''}:e);
    saveE(nl);setSel({...editF});showSav();setView('detail');setEditF(null);
  }
  function darBaja(id){if(!confirm('Confirmas dar de baja?'))return;updE(id,{activo:false});showSav();setView('list');}
  function reactivar(id){updE(id,{activo:true});showSav();setView('list');}
  function addDoc(eid){
    if(!nd.nombre||!nd.fecha){alert('Completa nombre y fecha');return;}
    const d={...docs,[eid]:[...(docs[eid]||[]),{...nd,id:Date.now()}]};
    saveD(d);showSav();setNd({nombre:'',tipo:'Permiso de salida',fecha:''});
  }
  function delDoc(eid,did){const d={...docs,[eid]:docs[eid].filter(x=>x.id!==did)};saveD(d);}
  function handleDocFile(file,eid){
    const rd=new FileReader();
    rd.onload=ev=>{
      const did=Date.now();
      let ok=false;try{localStorage.setItem('coe_df7_'+did,ev.target.result);ok=true;}catch(e){}
      const d={...docs,[eid]:[...(docs[eid]||[]),{nombre:file.name,tipo:'Archivo adjunto',fecha:new Date().toLocaleDateString('es-PE'),id:did,archivoNombre:file.name,tam:Math.round(file.size/1024)+'KB',ok}]};
      saveD(d);showSav();
    };
    rd.readAsDataURL(file);
  }
  function compFoto(file,cb){
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();

              <div style={{fontWeight:800,fontSize:17,color:c.dk}}>{emp.nombre}</div>
              <div style={{fontSize:12,color:c.tx,marginTop:2}}>{fm(emp.cargo)+' - '+fm(emp.empresa)}</div>
              <div style={{display:'flex',gap:5,marginTop:6,flexWrap:'wrap'}}>
                <span className="chip" style={{background:'#fff',color:c.dk,borderColor:c.bd}}>{emp.id}</span>
                <span className="chip" style={{background:'#fff',color:c.dk,borderColor:c.bd}}>{(emp.tipoDoc||'DNI')+': '+emp.dni}</span>
                {!emp.activo&&<span className="chip" style={{background:'#f5c4b0',color:'#7a3520',borderColor:'#f0a888'}}>BAJA</span>}
              </div>
            </div>
          </div>
          <div className={'db'+(isL?' lab':'')}>
            <div className="secs">
              <SC title="Datos Personales" bg="#fde8df" col="#7a3520"><IR label={(emp.tipoDoc||'DNI')+':'} val={emp.dni}/><IR label="Nacionalidad" val={emp.nacionalidad}/><IR label="F. Nacimiento" val={edDate(emp.fechaNac)}/><IR label="Edad" val={emp.edad?emp.edad+' anos':''}/><IR label="Profesion" val={emp.profesion}/><IR label="Estado Civil" val={emp.estadoCivil}/><IR label="N Hijos" val={emp.hijos}/></SC>
              <SC title="Datos Laborales" bg="#e0f1fb" col="#0e3f5e"><IR label="Empresa" val={emp.empresa}/><IR label="Cargo" val={emp.cargo}/><IR label="Contrato" val={emp.contrato}/><IR label="Inicio contrato" val={edDate(emp.inicioContrato)}/><IR label="Vcto. contrato" val={edDate(emp.vctoContrato)}/><IR label="Sueldo" val={emp.sueldo&&emp.sueldo!=='-'?'S/ '+emp.sueldo:'Por recibos'}/><IR label="AFP" val={emp.afp}/><IR label="F. Ingreso" val={edDate(emp.fIngreso)}/><IR label="Casillero" val={emp.casillero}/><IR label="COP" val={emp.cop}/></SC>
              <SC title="Contacto" bg="#e2f5ef" col="#1a4d3e"><IR label="Telefono" val={fP(emp.telefono)}/><IR label="Correo" val={emp.correo}/><IR label="Direccion" val={emp.direccion}/><IR label="Distrito" val={emp.distrito}/></SC>
              <SC title="Emergencia y Salud" bg="#fde8df" col="#7a3520"><IR label="Contacto" val={emp.emergenciaNombre}/><IR label="Parentesco" val={emp.emergenciaParentesco}/><IR label="Tel emergencia" val={fP(emp.emergenciaTel)}/><IR label="Alergias" val={emp.alergias}/><IR label="Enfermedades" val={emp.enfermedades}/><IR label="Tipo sangre" val={emp.sangre}/></SC>
              <SC title="Sistedent" bg="#fde8df" col="#7a3520"><IR label="Usuario" val={emp.usuarioSistedent}/><PR label="Clave" val={emp.claveSistedent} k={'sid_'+emp.id}/></SC>
              <SC title="Claves PC" bg="#fde8df" col="#7a3520"><IR label="Usuario PC" val={emp.clavePcUsuario}/><PR label="Contrasena PC" val={emp.clavePc} k={'pc_'+emp.id}/><IR label="Departamento" val={emp.deptoPc}/></SC>
              <SC title="Clave Celular" bg="#e2f5ef" col="#1a4d3e"><PR label="Patron / PIN" val={emp.claveCel} k={'cel_'+emp.id}/><IR label="Departamento" val={emp.deptoCel}/></SC>
              <SC title="Observaciones" bg="#f5f5f5" col="#333"><div style={{fontSize:12,lineHeight:1.6,color:emp.obs?'#1a1a1a':'#aaa'}}>{emp.obs||'Sin observaciones'}</div></SC>
            </div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>Documentos adjuntos</div>
            {!empDocs.length&&<div style={{color:'#aaa',fontSize:12,marginBottom:10}}>Sin documentos registrados.</div>}
            {empDocs.map(doc=><div key={doc.id} className="doc-item">
              <div className="doc-i"><div className="doc-n">{doc.nombre}</div><div className="doc-m">{doc.tipo+' - '+doc.fecha+(doc.tam?' - '+doc.tam:'')}</div></div>
              {doc.ok&&<button className="btn" style={{fontSize:11,background:'#e0f1fb',color:'#1a6a99',padding:'2px 8px'}} onClick={()=>{const d=localStorage.getItem('coe_df7_'+doc.id);if(d){const a=document.createElement('a');a.href=d;a.download=doc.archivoNombre||doc.nombre;a.click();}}}>Abrir</button>}
              <button className="btn" style={{background:'none',border:'none',color:'#aaa',fontSize:13}} onClick={()=>delDoc(emp.id,doc.id)}>X</button>
            </div>)}
            <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'flex-end',marginTop:8}}>
              <div className="fl" style={{flex:1,minWidth:120}}><label>Nombre</label><input type="text" value={nd.nombre} placeholder="Ej: Contrato 2026" onChange={e=>setNd(n=>({...n,nombre:e.target.value}))}/></div>
              <div className="fl"><label>Tipo</label><select value={nd.tipo} onChange={e=>setNd(n=>({...n,tipo:e.target.value}))}>{['Permiso de salida','Hoja de vacaciones','Contrato firmado','Certificado medico','Carta de compromiso','Memorandum','Ficha fisica','Otro'].map(o=><option key={o}>{o}</option>)}</select></div>
              <div className="fl"><label>Fecha</label><input type="date" value={nd.fecha} onChange={e=>setNd(n=>({...n,fecha:e.target.value}))}/></div>
              <button className="btn btn-p" onClick={()=>addDoc(emp.id)}>+ Registrar</button>
              <div className="fl"><label>Subir archivo</label><input type="file" onChange={e=>{const f=e.target.files&&e.target.files[0];if(f)handleDocFile(f,emp.id);e.target.value='';}}/></div>
            </div>
          </div>
        </>;
      })()}

      {/* EDIT */}
      {view==='edit'&&editF&&<div className="fw">
        <div style={{fontWeight:800,fontSize:17,marginBottom:16}}>Editar: {editF.nombre}</div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div className="fbox" style={{width:72,height:72}} onClick={()=>document.getElementById('fi_edit').click()}>
            {(editF.foto||fotos[editF.id])?<img src={editF.foto||fotos[editF.id]} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:'Foto'}
          </div>
          <input id="fi_edit" type="file" accept="image/*" style={{display:'none'}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(f)handleFoto(f,editF.id);e.target.value='';}}/>
          <button className="btn" style={{background:'#fde8df',border:'1.5px solid #f0a888',color:'#7a3520'}} onClick={()=>document.getElementById('fi_edit').click()}>Cambiar foto</button>
        </div>
        <div className="fg">
          <div style={{gridColumn:'1/-1',display:'grid',gridTemplateColumns:'1fr 2fr',gap:8}}>
            <FL label="Tipo doc." name="tipoDoc" opts={OPTS.tipoDoc} val={editF.tipoDoc} onChange={v=>setEditF(f=>({...f,tipoDoc:v}))}/>
            <FL label="N documento" name="dni" val={editF.dni} onChange={v=>setEditF(f=>({...f,dni:v}))}/>
          </div>
          {FLDS.map(([k,lbl,t])=><FL key={k} label={lbl} name={k} type={t} opts={OPTS[k]} val={editF[k]} onChange={v=>setEditF(f=>({...f,[k]:v}))}/>)}
          <div style={{gridColumn:'1/-1'}}><FL label="Observaciones" name="obs" type="ta" val={editF.obs} onChange={v=>setEditF(f=>({...f,obs:v}))}/></div>
        </div>
        <div style={{display:'flex',gap:8,marginTop:16}}>
          <button className="btn btn-s btn-lg" onClick={saveEdit}>Guardar cambios</button>
          <button className="btn btn-g btn-lg" onClick={()=>{setView('detail');setEditF(null);}}>Cancelar</button>
        </div>
      </div>}

      {/* ADD */}
      {view==='add'&&<div className="fw">
        <div style={{fontWeight:800,fontSize:17,marginBottom:16}}>Registrar nuevo trabajador</div>
        {!addF&&<button className="btn btn-p" onClick={()=>setAddF(emF())}>Iniciar registro</button>}
        {addF&&<>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
            <div className="fbox" style={{width:72,height:72}} onClick={()=>document.getElementById('fi_add').click()}>
              {addF.foto?<img src={addF.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:'Foto'}
            </div>
            <input id="fi_add" type="file" accept="image/*" style={{display:'none'}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(f)handleFoto(f,null);e.target.value='';}}/>
            <button className="btn" style={{background:'#fde8df',border:'1.5px solid #f0a888',color:'#7a3520'}} onClick={()=>document.getElementById('fi_add').click()}>Subir foto</button>
          </div>
          <div className="fg">
            <div style={{gridColumn:'1/-1',display:'grid',gridTemplateColumns:'1fr 2fr',gap:8}}>
              <FL label="Tipo doc *" name="tipoDoc" opts={OPTS.tipoDoc} val={addF.tipoDoc} onChange={v=>setAddF(f=>({...f,tipoDoc:v}))}/>
              <FL label="N documento *" name="dni" val={addF.dni} onChange={v=>setAddF(f=>({...f,dni:v}))}/>
            </div>
            <div style={{gridColumn:'1/-1'}}><FL label="Nombres y apellidos *" name="nombre" val={addF.nombre} onChange={v=>setAddF(f=>({...f,nombre:v}))}/></div>
            {FLDS.map(([k,lbl,t])=><FL key={k} label={lbl} name={k} type={t} opts={OPTS[k]} val={addF[k]} onChange={v=>setAddF(f=>({...f,[k]:v}))}/>)}
            <div style={{gridColumn:'1/-1'}}><FL label="Observaciones" name="obs" type="ta" val={addF.obs} onChange={v=>setAddF(f=>({...f,obs:v}))}/></div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:16}}>
            <button className="btn btn-p btn-lg" onClick={saveNew}>Guardar trabajador</button>
            <button className="btn btn-g btn-lg" onClick={()=>{setView('list');setAddF(null);}}>Cancelar</button>
          </div>
        </>}
      </div>}

      {/* IA */}
      {view==='ai'&&<div style={{background:'#fff',borderRadius:12,border:'1.5px solid #b8dcf5',overflow:'hidden'}}>
        <div style={{background:'#e0f1fb',padding:'12px 18px',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:38,height:38,borderRadius:10,background:'#b8dcf5',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,color:'#0e3f5e',fontSize:14}}>IA</div>
          <div>
            <div style={{fontWeight:800,fontSize:13,color:'#0e3f5e'}}>Asistente IA - COE Dental</div>
            <div style={{fontSize:11,color:'#1a6a99'}}>{emps.length+' trabajadores - '+activos.length+' activos - '+bajas.length+' bajas'}</div>
          </div>
        </div>
        {!ak?<div style={{padding:'14px 18px',background:'#fffde7',borderBottom:'1px solid #f5c4b0'}}>
          <div style={{fontSize:12,fontWeight:600,color:'#7a3520',marginBottom:5}}>Ingresa tu API Key para usar el Chat IA</div>
          <div style={{fontSize:11,color:'#b85c3a',marginBottom:8}}>Obten tu clave en console.anthropic.com - API Keys</div>
          <div style={{display:'flex',gap:7}}>
            <input type="password" placeholder="sk-ant-..." value={akInput} onChange={e=>setAkInput(e.target.value)} style={{flex:1,padding:'7px 10px',borderRadius:7,border:'1.5px solid #f0a888',fontSize:12}}/>
            <button className="btn btn-p" onClick={()=>{if(!akInput.trim()){alert('Ingresa una API Key valida');return;}setAK(akInput.trim());setAk(akInput.trim());}}>Guardar</button>
          </div>
        </div>:<div style={{padding:'4px 18px',background:'#e2f5ef',borderBottom:'1px solid #a8d9cc',fontSize:11,color:'#2a7a62',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>API Key configurada</span>
          <button className="btn" style={{fontSize:11,padding:'1px 7px',background:'none',border:'1px solid #a8d9cc',color:'#2a7a62'}} onClick={()=>{setAK('');setAk('');}}>Cambiar</button>
        </div>}
        <div style={{display:'flex',borderBottom:'1px solid #eee',padding:'0 18px'}}>
          {[['chat','Chat IA'],['buscar','Buscador']].map(([t,l])=><button key={t} onClick={()=>setAiTab(t)} style={{borderRadius:0,border:'none',borderBottom:aiTab===t?'2px solid #1a6a99':'2px solid transparent',background:'none',padding:'8px 12px',fontSize:12,cursor:'pointer',fontWeight:aiTab===t?700:400,color:aiTab===t?'#0e3f5e':'#aaa'}}>{l}</button>)}
        </div>
        {aiTab==='chat'&&<>
          <div className="chat-wrap">
            {chat.map((m,i)=><div key={i} className={'cb '+m.r}>{m.t}</div>)}
            {cld&&<div className="cb a">Consultando...</div>}
            <div ref={chatEnd}/>
          </div>
          <div style={{borderTop:'1.5px solid #b8dcf5',padding:'10px 18px',display:'flex',gap:7}}>
            <input type="text" value={ci} placeholder="Ej: Cuantos en planilla? / Telefono de Rebeca" onChange={e=>setCi(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendChat()} style={{flex:1,padding:'8px 12px',borderRadius:8,border:'1.5px solid #b8dcf5',fontSize:12,outline:'none'}}/>
            <button className="btn" style={{padding:'8px 14px',background:(cld||!ak)?'#eee':'#a8d4ee',color:(cld||!ak)?'#aaa':'#0e3f5e'}} onClick={sendChat} disabled={cld||!ak}>Enviar</button>
          </div>
          <div style={{padding:'0 18px 12px',display:'flex',gap:5,flexWrap:'wrap'}}>
            {['Cuantos en planilla?','Personal Coe Lab','Quien tiene alergias?','Trabajadores de baja'].map(s=><button key={s} onClick={()=>setCi(s)} style={{padding:'3px 8px',borderRadius:16,border:'1.5px solid #b8dcf5',background:'#e0f1fb',fontSize:10,cursor:'pointer',color:'#1a6a99'}}>{s}</button>)}
          </div>
        </>}
        {aiTab==='buscar'&&<div style={{padding:'16px 18px'}}>
          <div style={{display:'flex',gap:7,marginBottom:12}}>
            <input type="text" value={bq} placeholder="Ej: telefono / alergias / Coe Lab / bajas..." onChange={e=>setBq(e.target.value)} onKeyDown={e=>e.key==='Enter'&&buscar()} style={{flex:1,padding:'8px 12px',borderRadius:8,border:'1.5px solid #b8dcf5',fontSize:12,outline:'none'}}/>
            <button className="btn" style={{background:'#a8d4ee',color:'#0e3f5e'}} onClick={buscar}>Buscar</button>
          </div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}}>
            {['planilla','Coe Lab','alergias','bajas','COP','emergencia'].map(t=><button key={t} onClick={()=>{setBq(t);buscar();}} style={{padding:'3px 8px',borderRadius:16,border:'1.5px solid #b8dcf5',background:'#e0f1fb',fontSize:10,cursor:'pointer',color:'#1a6a99'}}>{t}</button>)}
          </div>
          <div className="sr">
            {!res.length&&!bq&&<div style={{color:'#aaa',fontSize:12,textAlign:'center',paddingTop:30}}>Escribe algo para buscar</div>}
            {!res.length&&bq&&<div style={{color:'#aaa',fontSize:12,textAlign:'center',paddingTop:30}}>Sin resultados para "{bq}"</div>}
            {res.map((r,i)=><div key={i} className="ri">{r}</div>)}
          </div>
        </div>}
      </div>}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
